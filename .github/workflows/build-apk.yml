name: Build ElinaAI V16

on:
  workflow_dispatch:

  push:
    paths:
      - "ElinaAi2.0-fixed-v16.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ElinaAI v5.2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify V16 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ElinaAi2.0-fixed-v16.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo ""
            echo "Repository root:"
            ls -lah
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

      - name: Extract V16
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "ElinaAi2.0-fixed-v16.zip" -d extracted

          echo "Extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Extracted structure:"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project validation passed."

      - name: Verify Elina VRM
        shell: bash
        run: |
          set -e

          VRM="$PROJECT_DIR/app/src/main/assets/avatar/model.vrm"

          if [ ! -f "$VRM" ]; then
            echo "ERROR: model.vrm not found."
            echo ""
            echo "Avatar files:"
            find "$PROJECT_DIR/app/src/main/assets/avatar" \
              -maxdepth 2 \
              -type f \
              -print
            exit 1
          fi

          echo "VRM found:"
          ls -lh "$VRM"

      - name: Check Java
        shell: bash
        run: |
          java -version

      - name: Check Gradle wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Gradle wrapper:"
          ls -lh gradlew

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building ElinaAI release APK..."

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE APK."

            echo ""
            echo "Files found:"
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          APK_FILE=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          echo ""
          echo "APK generated:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v5.2.0
          path: "${{ env.APK_FILE }}"
          if-no-files-found: error
          retention-days: 7
