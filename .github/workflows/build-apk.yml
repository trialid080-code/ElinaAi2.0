 name: Build ElinaAI

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v15.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ElinaAI v5.2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify V15 ZIP
        shell: bash
        run: |
          set -e
          test -f "ElinaAi2.0-fixed-v15.zip"
          echo "V15 ZIP:"
          ls -lh "ElinaAi2.0-fixed-v15.zip"

      - name: Extract V15
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "ElinaAi2.0-fixed-v15.zip" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify Elina VRM
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/src/main/assets/avatar/elina.vrm"

          echo "Elina VRM:"
          ls -lh "$PROJECT_DIR/app/src/main/assets/avatar/elina.vrm"

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly ONE APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 APK."
            find "$APK_DIR" -maxdepth 1 -type f -print
            exit 1
          fi

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v5.2.0
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
