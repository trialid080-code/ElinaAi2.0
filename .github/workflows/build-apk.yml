name: Build Elina APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v5.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check ZIP
        run: |
          set -e

          if [ ! -f "ElinaAi2.0-fixed-v5.zip" ]; then
            echo "ERROR: ElinaAi2.0-fixed-v5.zip not found"
            ls -la
            exit 1
          fi

          ls -lh "ElinaAi2.0-fixed-v5.zip"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "ElinaAi2.0-fixed-v5.zip" -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check
