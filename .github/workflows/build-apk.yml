name: Build Elina APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v11.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify ZIP
        shell: bash
        run: |
          set -e
          test -f "ElinaAi2.0-fixed-v11.zip"
          ls -lh "ElinaAi2.0-fixed-v11.zip"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "ElinaAi2.0-fixed-v11.zip" -d extracted
          echo "ZIP extracted successfully"

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"
          chmod +x "$PROJECT_DIR/gradlew"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" \
            -print -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAi2.0-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
