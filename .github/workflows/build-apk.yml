name: Build Elina APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v3.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify uploaded ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ElinaAi2.0-fixed-v3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Using ZIP:"
          ls -lh "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "ElinaAi2.0-fixed-v3.zip" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f -print | head -150

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted \
              -type f \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Complete Android Gradle project not found."
            echo "Possible files:"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace
