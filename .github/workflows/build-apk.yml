name: Build ElinaAI V18

on:
  workflow_dispatch:

  push:
    paths:
      - "ElinaAi2.0-fixed-v18.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ElinaAI v5.3.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify V18 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ElinaAi2.0-fixed-v18.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          ls -lh "$ZIP_FILE"

      - name: Extract V18
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "ElinaAi2.0-fixed-v18.zip" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 7 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/avatar/model.vrm"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify release signing
        shell: bash
        run: |
          set -e

          grep -q 'signingConfig = signingConfigs.getByName("debug")' \
            "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE APK."
            find "$APK_DIR" -maxdepth 1 -type f -print
            exit 1
          fi

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v5.3.0
          path: "${{ env.APK }}"
          if-no-files-found: error
          retention-days: 7
