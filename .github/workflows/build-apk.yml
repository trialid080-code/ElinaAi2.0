name: Build Elina APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v5.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "ElinaAi2.0-fixed-v5.zip" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          ls -lh "ElinaAi2.0-fixed-v5.zip"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "ElinaAi2.0-fixed-v5.zip" -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project files
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"

          ls -la "$PROJECT_DIR"
