name: Build ElinaAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v14.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ElinaAI v5.2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify V14 ZIP
        run: |
          set -e
          test -f "ElinaAi2.0-fixed-v14.zip"
          ls -lh "ElinaAi2.0-fixed-v14.zip"

      - name: Extract V14
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "ElinaAi2.0-fixed-v14.zip" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Prepare Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build ONE release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $COUNT"

          test "$COUNT" -eq 1

          find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v5.2.0
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
