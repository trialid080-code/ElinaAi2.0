name: Build ElinaAI

on:
  workflow_dispatch:

  push:
    paths:
      - "ElinaAi2.0-fixed-v15.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ElinaAI v5.2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify V15 ZIP
        shell: bash
        run: |
          set -e

          echo "Checking V15 ZIP..."

          if [ ! -f "ElinaAi2.0-fixed-v15.zip" ]; then
            echo "ERROR: ElinaAi2.0-fixed-v15.zip not found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "V15 ZIP found:"
          ls -lh "ElinaAi2.0-fixed-v15.zip"

      - name: Extract V15 project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting V15..."
          unzip -q "ElinaAi2.0-fixed-v15.zip" -d extracted

          echo "Extraction complete."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            candidate="$(dirname "$gradle_file")"

            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/app" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find extracted -type f -name "gradlew")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside V15 ZIP."
            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 7 -type f -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "Validating Android project..."

          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Project validation passed."

      - name: Verify Elina VRM
        shell: bash
        run: |
          set -e

          VRM_FILE="$PROJECT_DIR/app/src/main/assets/avatar/model.vrm"

          if [ ! -f "$VRM_FILE" ]; then
            echo "ERROR: Elina VRM not found:"
            echo "$VRM_FILE"
            echo ""
            echo "Avatar directory:"
            find "$PROJECT_DIR/app/src/main/assets/avatar" \
              -maxdepth 2 \
              -type f \
              -print
            exit 1
          fi

          echo "Elina VRM found:"
          ls -lh "$VRM_FILE"

      - name: Show Java version
        shell: bash
        run: |
          java -version

      - name: Show Gradle project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Gradle wrapper:"
          ls -lh ./gradlew

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting ElinaAI release build..."

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory does not exist."
            exit 1
          fi

          COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE APK."
            echo ""
            echo "APK files found:"
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          APK_FILE=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          echo ""
          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v5.2.0
          path: "${{ env.APK_FILE }}"
          if-no-files-found: error
          retention-days: 7
