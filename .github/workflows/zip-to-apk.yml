name: Build ElinaAI APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"

permissions:
  contents: read

jobs:
  build:
    name: ZIP to signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "Android SDK: $ANDROID_HOME"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              ! -path "$GITHUB_WORKSPACE/.git/*" \
              | sort
          )

          echo "ZIP files found: ${#ZIPS[@]}"
          printf '  %s\n' "${ZIPS[@]}"

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No project ZIP was found in the repository. Upload the ElinaAI project ZIP first."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP was found. Keep only the project ZIP in the repository or remove the extra ZIP files."
            exit 1
          fi

          echo "PROJECT_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/elina-project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_DIR"

          mapfile -t WRAPPERS < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              ! -path "*/.gradle/*" \
              | sort
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::The ZIP does not contain a Gradle project (gradlew was not found)."
            exit 1
          fi

          if [ "${#WRAPPERS[@]}" -gt 1 ]; then
            echo "::error::The ZIP contains multiple gradlew files; refusing to guess which project to build."
            printf '  %s\n' "${WRAPPERS[@]}"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "${WRAPPERS[0]}")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          find "$PROJECT_ROOT" -maxdepth 2 -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) -print

      - name: Verify extracted Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/gradlew" || {
            echo "::error::Gradle wrapper is missing from extracted project."
            exit 1
          }

          test -f "$PROJECT_ROOT/settings.gradle.kts" || {
            echo "::error::settings.gradle.kts is missing from extracted project."
            exit 1
          }

          test -f "$PROJECT_ROOT/app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts is missing from extracted project."
            exit 1
          }

          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml is missing from extracted project."
            exit 1
          }

          AVATAR_DIR="$PROJECT_ROOT/app/src/main/assets/avatar"
          mapfile -t VRMS < <(find "$AVATAR_DIR" -maxdepth 1 -type f -iname "*.vrm" | sort)

          if [ "${#VRMS[@]}" -eq 0 ]; then
            echo "::error::No .vrm avatar file was found under app/src/main/assets/avatar."
            exit 1
          fi

          if [ "${#VRMS[@]}" -gt 1 ]; then
            echo "::error::Multiple .vrm files were found. Refusing to guess which avatar should be packaged."
            printf '  %s\n' "${VRMS[@]}"
            exit 1
          fi

          chmod +x "$PROJECT_ROOT/gradlew"

          echo "Android project verified."
          echo "VRM asset: ${VRMS[0]}"
          ls -lh "${VRMS[0]}"

      - name: Build signed release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify exactly one release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_ROOT/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          echo "Release APKs found: ${#APKS[@]}"
          printf '  %s\n' "${APKS[@]}"

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "::error::More than one release APK was produced; refusing to guess which one to upload."
            exit 1
          fi

          APK="${APKS[0]}"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 2 \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the installed Android build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload single APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-release-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
          
